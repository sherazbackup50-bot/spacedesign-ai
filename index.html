<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpaceDesign AI</title>
<style>
:root{--bg:#f1f3f1;--ink:#12201f;--mut:#5d6b69;--card:#fff;--line:#d9dfdc;--teal:#0b6e6e;--gold:#d9a441;--ok:#1f7a4d;--warn:#a8620a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:6px 0 2px}h2{font-size:18px;margin:0 0 8px}h3{font-size:17px;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label.l{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input.f,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}.row>select{flex:0 0 38%}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--teal);color:#fff;font:inherit;font-weight:700;margin-top:14px;text-align:center;text-decoration:none;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:8px}
.btn:disabled{opacity:.5}
.pw{position:relative}.pw .btn{margin-top:0}
.pw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
#prev{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:10px}
.hero{width:100%;border-radius:12px;display:block;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
.pal{display:flex;gap:6px;margin:8px 0}.pal span{flex:1;height:26px;border-radius:8px;border:1px solid var(--line)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);margin:8px 6px 0 0}
.best{background:var(--gold);border-color:var(--gold);color:#2a1d00}
.cost{font-size:21px;font-weight:800;margin:6px 0}
.ok{color:var(--ok)}.warn{color:var(--warn)}
ul{margin:6px 0;padding-left:20px}
.msg{padding:12px;border-radius:10px;background:#fff;border:1px solid var(--line);margin-bottom:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>SpaceDesign AI</h1>
<p class="sub">Photograph any space. Get a redesigned picture and a budget.</p>
<div class="tabs"><button id="t1" class="on">Design</button><button id="t2">Contact us</button></div>

<section id="p1">
  <div class="card">
    <h2>Your space</h2>
    <div class="row">
      <div class="pw"><span class="btn alt">📷 Take photo</span><input id="cam" type="file" accept="image/*" capture="environment"></div>
      <div class="pw"><span class="btn alt">🖼️ Choose photo</span><input id="pic" type="file" accept="image/*"></div>
    </div>
    <img id="prev" alt="Your photo" hidden>
    <label class="l" for="budget">Budget</label>
    <div class="row"><input class="f" id="budget" type="number" inputmode="decimal" min="0" placeholder="e.g. 2000"><select id="cur"><option>EUR</option><option>USD</option><option>GBP</option></select></div>
    <label class="l" for="style">Style (optional)</label>
    <select id="style"><option value="">Surprise me</option><option>Modern</option><option>Minimalist</option><option>Scandinavian</option><option>Mediterranean</option><option>Classic</option><option>Industrial</option><option>Cozy and warm</option></select>
    <button id="go" class="btn" disabled>Create my design</button>
  </div>
  <div id="out"></div>
</section>

<section id="p2" hidden>
  <div class="card">
    <h2>Contact us</h2>
    <p class="sub">We’d love to help with your project.</p>
    <a class="btn" href="tel:+35794344349">Call +357 94 344349</a>
    <a class="btn alt" href="mailto:mspremiumquality@gmail.com">mspremiumquality@gmail.com</a>
    <a class="btn alt" href="https://www.google.com/maps/search/?api=1&query=Nicosia%2C%20Cyprus" target="_blank" rel="noopener">Nicosia, Cyprus – open map</a>
  </div>
  <div class="card">
    <h2>Send a message</h2>
    <label class="l" for="nm">Your name</label><input class="f" id="nm">
    <label class="l" for="ms">Message</label><textarea id="ms" rows="4" placeholder="Tell us about your space and budget"></textarea>
    <button id="send" class="btn">Send by email</button>
  </div>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
let photo=null;
function show(n){$('#p1').hidden=n!==1;$('#p2').hidden=n!==2;$('#t1').classList.toggle('on',n===1);$('#t2').classList.toggle('on',n===2)}
$('#t1').onclick=()=>show(1);$('#t2').onclick=()=>show(2);
$('#send').onclick=()=>{
  const s=encodeURIComponent('Design enquiry from '+($('#nm').value||'a customer'));
  location.href='mailto:mspremiumquality@gmail.com?subject='+s+'&body='+encodeURIComponent($('#ms').value);
};
function say(t,busy){const d=document.createElement('div');d.className='msg';if(busy){const s=document.createElement('span');s.className='spin';d.append(s)}d.append(t);$('#out').replaceChildren(d)}
function shrink(f){return new Promise((res,rej)=>{
  const u=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{const k=Math.min(1,1024/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',.85))};
  img.onerror=()=>rej(new Error('read'));img.src=u})}
async function onPick(e){
  const f=e.target.files[0];if(!f)return;
  try{photo=await shrink(f);$('#prev').src=photo;$('#prev').hidden=false;$('#go').disabled=false;$('#out').replaceChildren()}
  catch(_){say('This photo could not be read. Choose another one.')}
}
$('#cam').onchange=onPick;$('#pic').onchange=onPick;
function esc(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML}
$('#go').onclick=async()=>{
  const budget=$('#budget').value;
  if(!budget){say('Enter your budget first.');return}
  const btn=$('#go');btn.disabled=true;
  say('Designing your space. This takes about a minute.',true);
  try{
    const r=await fetch('/api/design',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({image:photo.split(',')[1],mime:'image/jpeg',budget,currency:$('#cur').value,style:$('#style').value})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||'Request failed');
    render(data,$('#cur').value);
  }catch(e){say(e.message||'Something went wrong. Try again.')}
  finally{btn.disabled=false}
};
function render(d,cur){
  const out=$('#out');out.replaceChildren();
  const h=document.createElement('div');h.className='card';h.innerHTML='<h2>Your space</h2>'+esc(d.space);out.append(h);
  const list=(d.concepts||[]).map((c,i)=>({c,i})).sort((a,b)=>(b.i===d.best)-(a.i===d.best));
  list.forEach(({c,i})=>{
    const el=document.createElement('div');el.className='card';
    const pal=(c.palette||[]).filter(x=>/^#[0-9a-fA-F]{3,8}$/.test(x)).map(x=>'<span style="background:'+x+'"></span>').join('');
    el.innerHTML=(c.image?'<img class="hero" alt="Redesigned space" src="'+c.image+'">':'')+
      (i===d.best?'<span class="tag best">Best match</span>':'')+'<span class="tag">'+esc(c.style)+'</span>'+
      '<h3>'+esc(c.name)+'</h3><div style="color:var(--mut)">'+esc(c.summary)+'</div>'+
      '<div class="pal">'+pal+'</div>'+
      '<div class="cost">'+Number(c.cost_low).toLocaleString()+' – '+Number(c.cost_high).toLocaleString()+' '+cur+'</div>'+
      '<div class="'+(c.within_budget?'ok':'warn')+'">'+(c.within_budget?'Within your budget':'Slightly over budget')+' (estimate)</div>'+
      '<ul>'+(c.changes||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
    if(c.image){const a=document.createElement('a');a.className='btn alt';a.textContent='Save picture';a.href=c.image;a.download='design.png';el.append(a)}
    out.append(el);
  });
  const ct=document.createElement('button');ct.className='btn';ct.textContent='Talk to us about this design';ct.onclick=()=>show(2);out.append(ct);
}
</script>
</body>
</html>
